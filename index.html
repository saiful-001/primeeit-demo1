<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>খাঁটি মধু ও প্রিমিয়াম হানি নাট – অর্ডার করুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 1. Top heading -->
<header class="s-top">
  <h1 id="topHeading"></h1>
</header>

<!-- 2. Video -->
<section class="s-video">
  <div class="video-box" id="videoBox"></div>
</section>

<!-- 3. Red notice -->
<div class="s-notice"><span class="notice" id="noticeText"></span></div>

<!-- 4. Primary order button -->
<div class="s-cta"><button type="button" class="btn-order" data-scroll-order>👍 এখনই অর্ডার করুন</button></div>

<!-- 5. Benefits card -->
<section class="s-benefits">
  <div class="benefit-card">
    <h2 class="bar" id="benefitsTitle"></h2>
    <ul class="checks" id="benefitsList"></ul>
    <div class="s-cta in-card"><button type="button" class="btn-order" data-scroll-order>👍 এখনই অর্ডার করুন</button></div>
  </div>
</section>

<!-- 6. Dark strip -->
<div class="s-strip" id="strip1"></div>

<!-- 7. Product / store carousel -->
<section class="s-gallery">
  <div class="carousel" data-carousel="gallery"></div>
  <div class="s-cta"><button type="button" class="btn-order" data-scroll-order>👍 এখনই অর্ডার করুন</button></div>
</section>

<!-- 8. Reviews -->
<section class="s-reviews">
  <h2 class="bar wide" id="reviewsTitle"></h2>
  <div class="carousel" data-carousel="reviews"></div>
  <div class="s-cta"><button type="button" class="btn-order" data-scroll-order>👍 এখনই অর্ডার করুন</button></div>
</section>

<!-- 9. Documents -->
<section class="s-docs">
  <h2 class="bar green-strip" id="docsTitle"></h2>
  <div class="carousel dark" data-carousel="documents"></div>
</section>

<!-- 10. Offer banner -->
<section class="s-offer">
  <p class="offer-line" id="offerLine"></p>
  <p class="offer-price"><del id="offerOld"></del> <strong id="offerNew"></strong></p>
  <p class="offer-note" id="offerNote"></p>
  <button type="button" class="btn-order" data-scroll-order>👍 এখনই অর্ডার করুন</button>
</section>

<!-- 11. Dark strip 2 -->
<div class="s-strip" id="strip2"></div>

<!-- 12. Checkout -->
<section class="s-checkout" id="checkout">
  <div class="checkout-wrap">
    <h2 class="bar wide" id="checkoutTitle"></h2>
    <form id="orderForm" novalidate>
      <div class="co-grid">
        <div class="co-left">
          <h3 class="sub">পছন্দের পণ্য বেছে নিন (এক বা একাধিক সিলেক্ট করতে পারেন)</h3>
          <div class="packages" id="packages" aria-label="পণ্য তালিকা"></div>

          <h3 class="sub">বিলিং তথ্য</h3>
          <div class="field"><label for="name">আপনার নাম <i>*</i></label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="আপনার পূর্ণ নাম">
            <small class="err" data-err="name"></small></div>
          <div class="field"><label for="phone">মোবাইল নাম্বার <i>*</i></label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">
            <small class="err" data-err="phone"></small></div>
          <div class="field"><label for="district">জেলা / এলাকা <i>*</i></label>
            <input id="district" name="district" type="text" placeholder="যেমন: ঢাকা">
            <small class="err" data-err="district"></small></div>
          <div class="field"><label for="address">সম্পূর্ণ ঠিকানা <i>*</i></label>
            <textarea id="address" name="address" rows="2" autocomplete="street-address" placeholder="বাসা/রোড/থানা"></textarea>
            <small class="err" data-err="address"></small></div>
          <div class="field"><label for="note">অর্ডার নোট (ঐচ্ছিক)</label>
            <textarea id="note" name="note" rows="2" placeholder="কোনো বিশেষ নির্দেশনা থাকলে লিখুন"></textarea></div>
        </div>

        <aside class="co-right">
          <h3 class="sub">আপনার অর্ডার</h3>
          <div class="summary">
            <div class="sum-row head"><span>পণ্য</span><span>মোট</span></div>
            <div class="sum-items-list" id="sumItemsList"></div>
            <div class="sum-row"><span>সাব-টোটাল</span><span id="sumSub">—</span></div>
            <div class="sum-row discount" id="sumDiscountRow" style="display:none"><span>অফার ডিসকাউন্ট</span><span id="sumDiscount">—</span></div>
            <div class="ship" id="shipping" role="radiogroup" aria-label="ডেলিভারি"></div>
            <div class="sum-row"><span>ডেলিভারি চার্জ</span><span id="sumShip">—</span></div>
            <div class="sum-row total"><span>সর্বমোট</span><span id="sumTotal">—</span></div>
            <p class="pay-note">ক্যাশ অন ডেলিভারি – পণ্য হাতে পেয়ে টাকা দিন।</p>
          </div>
          <input type="text" name="website" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
          <button type="submit" class="btn-submit" id="submitBtn"><span class="spin" aria-hidden="true"></span><span id="submitLabel">অর্ডার কনফার্ম করুন</span></button>
          <div class="form-msg" id="formMsg" role="status" aria-live="polite"></div>
        </aside>
      </div>
    </form>
  </div>
</section>

<!-- 13. Footer -->
<footer class="s-footer">
  <p id="footMsg"></p>
  <p class="links"><a href="#" id="lnkPrivacy">Privacy Policy</a> | <a href="#" id="lnkTerms">Terms &amp; Conditions</a></p>
  <p class="credit" id="footCredit"></p>
</footer>

<script src="js/config.js"></script>
<script src="js/script.js"></script>
<script src="js/effects.js"></script>
</body>
</html>
